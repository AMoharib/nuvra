name: macOS builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[build]'
      - name: Verify native architecture
        run: python -c "import platform; assert platform.machine() == '${{ matrix.arch }}'"
      - name: macOS integration and shared delivery tests
        run: python -m unittest discover -s tests -p 'test_macos.py' -v
      - name: Shared clipboard delivery tests
        run: python -m unittest discover -s tests -p 'test_paste.py' -v
      - name: Build and self-test the app, DMG, and ZIP
        run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/Nuvra-*-macos-*.dmg
            dist/Nuvra-*-macos-*.zip
            dist/SHA256SUMS-macos-*.txt
          if-no-files-found: error
